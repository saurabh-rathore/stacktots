<div class="dashboard-container">
  <h2>Dashboard</h2>

  <h3>Stories</h3>
  <div class="content-grid">
    <div *ngFor="let item of stories" class="content-card">
      <img [src]="item.url" alt="{{ item.title }}">
      <h4>{{ item.title }}</h4>
      <p>{{ item.description }}</p>
    </div>
  </div>

  <h3>Games</h3>
  <div class="content-grid">
    <div *ngFor="let item of games" class="content-card">
      <img [src]="item.url" alt="{{ item.title }}">
      <h4>{{ item.title }}</h4>
      <p>{{ item.description }}</p>
    </div>
  </div>

  <h3>Videos</h3>
  <div class="content-grid">
    <div *ngFor="let item of videos" class="content-card">
      <img [src]="item.url" alt="{{ item.title }}">
      <h4>{{ item.title }}</h4>
      <p>{{ item.description }}</p>
    </div>
  </div>
</div>
