<div class="puzzle-container" *ngIf="puzzle">
  <h2>{{ puzzle.title }}</h2>
  <p>{{ puzzle.description }}</p>

  <div *ngIf="puzzle.data.image">
    <img [src]="puzzle.data.image" alt="{{ puzzle.title }}">
  </div>

  <div *ngIf="puzzle.data.words">
    <!-- Placeholder for word search puzzle -->
    <p>Word Search Puzzle coming soon!</p>
  </div>
</div>
